{% extends 'base.html' %}

{% block title %}Посты{% endblock %}

{% block content %}
<h1 class="my-4">Последние посты</h1>
<div class="row">
    {% for post in posts %}
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <img src="{{ url_for('static', filename='images/' + post.image_id) }}" 
                 class="card-img-top" alt="{{ post.title }}"
                 style="height: 200px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.text[:150] }}...</p>
                <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn-primary">Читать далее →</a>
            </div>
            <div class="card-footer text-muted">
                {{ post.author }} | {{ post.date.strftime('%d.%m.%Y %H:%M') }}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
